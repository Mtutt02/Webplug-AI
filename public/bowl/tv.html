<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StrikeCast — Lane</title>
<meta name="description" content="The StrikeCast lane. Cast your phone swing onto the big screen.">
<meta name="theme-color" content="#0a0c12">
<link rel="manifest" href="/bowl/manifest.webmanifest">
<link rel="apple-touch-icon" href="/bowl/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/bowl/app.css">
<style>
  html,body{overflow:hidden}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.show{display:flex}

  /* ---- pairing / setup ---- */
  #pair,#setup{align-items:center;justify-content:center;padding:24px}
  .panel{max-width:520px;width:100%}
  .qrbox{background:#fff;border-radius:16px;padding:16px;width:200px;height:200px;display:grid;place-items:center;margin-inline:auto}
  #qr img,#qr canvas{display:block}
  .joinurl{word-break:break-all}
  .count{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .count button{font-family:var(--fdisp);font-size:1.6rem;width:58px;height:58px;border-radius:14px;
    border:1px solid var(--ink3);background:var(--ink2);color:var(--pin);cursor:pointer}
  .count button.sel{background:var(--strike);color:#1a0a04;border-color:var(--strike)}

  /* ---- game ---- */
  #game{background:#06080d}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;
    padding-top:max(12px,env(safe-area-inset-top,0px));background:linear-gradient(#0a0c12,transparent)}
  .nowup{display:flex;align-items:center;gap:10px}
  .nowup .who{font-family:var(--fdisp);font-size:1.5rem;text-transform:uppercase}
  .frameno{font-family:var(--fmono);font-size:.8rem;letter-spacing:.16em;color:var(--muted)}
  .hud{flex:none}
  canvas{flex:1 1 0;min-height:0;width:100%;display:block}
  .toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;
    font-family:var(--fdisp);font-size:clamp(3rem,13vw,7rem);text-transform:uppercase;letter-spacing:.04em;
    color:var(--strike);text-shadow:0 0 50px rgba(255,90,44,.6);pointer-events:none;transition:all .35s cubic-bezier(.2,1.4,.4,1)}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast.spare{color:var(--cast);text-shadow:0 0 50px rgba(50,224,207,.6)}

  /* scoreboard */
  .board{flex:none;background:#0a0c12;border-top:1px solid var(--ink3);overflow-x:auto;padding-bottom:max(0px,env(safe-area-inset-bottom,0px))}
  table{border-collapse:collapse;width:100%;min-width:640px;font-family:var(--fmono)}
  th,td{border:1px solid var(--ink3);text-align:center;padding:4px 2px;font-size:.78rem}
  th{color:var(--muted);font-weight:400;letter-spacing:.08em}
  .pname{text-align:left;padding-left:10px;font-family:var(--fbody);font-weight:800;white-space:nowrap}
  tr.active .pname{color:var(--strike)}
  .frame{position:relative;height:38px;min-width:46px}
  .balls{position:absolute;top:0;right:0;display:flex}
  .balls span{width:16px;height:16px;line-height:16px;border-left:1px solid var(--ink3);border-bottom:1px solid var(--ink3);
    font-size:.72rem;color:var(--pin)}
  .balls span.x{color:var(--strike)} .balls span.sp{color:var(--cast)}
  .total{position:absolute;bottom:2px;left:0;right:0;font-size:.9rem;font-weight:700;color:var(--pin)}
  .f10{min-width:66px}
  .status{font-family:var(--fmono);font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:8px}

  .btnrow{display:flex;gap:12px;margin-top:6px}
</style>
</head>
<body>

<!-- SETUP -->
<section id="setup" class="screen show">
  <div class="panel col center">
    <div class="brand"><svg class="logo" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="none" stroke="#1a2030" stroke-width="2"/><path d="M15 4C11 10 11 20 15 26 19 20 19 10 15 4Z" fill="#f6f1e7"/><circle cx="15" cy="9" r="2.1" fill="#ff5a2c"/></svg>Strike<span class="mk">Cast</span></div>
    <p class="eyebrow">Set up the lane</p>
    <h1 class="disp" style="font-size:2.4rem">How many bowlers?</h1>
    <div class="count" id="count">
      <button data-n="1" class="sel">1</button><button data-n="2">2</button><button data-n="3">3</button>
      <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    </div>
    <p class="muted" style="margin:0">Pass the phone around — everyone bowls their own frames.</p>
    <button class="btn cast" id="toPair">Open the lane →</button>
  </div>
</section>

<!-- PAIR -->
<section id="pair" class="screen">
  <div class="panel card col center">
    <p class="eyebrow">Scan to grab the controller</p>
    <div class="qrbox"><div id="qr"></div></div>
    <p class="muted" style="margin:0">or go to <b class="joinurl" id="joinHost"></b> and enter</p>
    <div class="code" id="codeOut">····</div>
    <div class="status"><span class="dot wait" id="pairDot"></span><span id="pairMsg">Opening lane…</span></div>
    <div class="btnrow">
      <button class="btn ghost" id="backSetup">← Back</button>
      <button class="btn primary" id="skipPair" title="Bowl on this screen with touch/keys">Practice without a phone</button>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="hud">
    <div class="nowup"><span class="who" id="whoUp">Player 1</span><span class="frameno" id="frameNo">Frame 1 · Ball 1</span></div>
    <div class="status"><span class="dot" id="gameDot"></span><span id="gameMsg">controller</span></div>
  </div>
  <canvas id="lane"></canvas>
  <div class="toast" id="toast">STRIKE!</div>
  <div class="board"><table id="board"></table></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/bowl/net.js"></script>
<script src="/bowl/game.js"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/bowl/sw.js").catch(() => {});
</script>
</body>
</html>
