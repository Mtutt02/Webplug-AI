<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StrikeCast — Camera check</title>
<meta name="theme-color" content="#0a0c12">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0a0c12;color:#f6f1e7;font-family:system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:18px}
  h1{font-size:1.3rem;margin:4px 0 2px}
  p.sub{color:#9199ad;margin:0 0 14px;font-size:.9rem}
  button{font-size:1.05rem;padding:14px 20px;border-radius:14px;border:none;background:#ff5a2c;color:#1a0a04;font-weight:800;cursor:pointer;width:100%}
  button:disabled{opacity:.5}
  video{width:100%;max-width:280px;border-radius:12px;background:#000;margin-top:12px;transform:scaleX(-1)}
  #log{margin-top:16px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .row{padding:7px 10px;border-radius:8px;margin-bottom:6px;background:#12151d;border:1px solid #1a2030}
  .ok{color:#32e0cf}.bad{color:#ff7a5a}.wait{color:#e0b44a}
  .ua{color:#6b7280;font-size:.72rem;margin-top:14px;word-break:break-all}
  .hint{margin-top:14px;padding:12px;border-radius:10px;background:rgba(255,90,44,.1);border:1px solid #3a2420;font-size:.86rem;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <h1>StrikeCast — camera check</h1>
  <p class="sub">Taps through every step the camera bowling needs and shows exactly where it stops.</p>
  <button id="run">Run the check</button>
  <video id="v" playsinline muted autoplay></video>
  <div id="log"></div>
  <div class="hint" id="hint" hidden></div>
  <div class="ua" id="ua"></div>
</div>
<script>
  var log = document.getElementById("log"), hintEl = document.getElementById("hint");
  document.getElementById("ua").textContent = "UA: " + navigator.userAgent;
  function line(txt, cls){ var d=document.createElement("div"); d.className="row "+(cls||""); d.textContent=txt; log.appendChild(d); return d; }
  function hint(txt){ hintEl.hidden=false; hintEl.textContent="👉 "+txt; }
  window.addEventListener("error", function(e){ line("⚠ page error: "+(e.message||e), "bad"); });
  window.addEventListener("unhandledrejection", function(e){ line("⚠ promise rejected: "+((e.reason&&e.reason.message)||e.reason), "bad"); });

  document.getElementById("run").addEventListener("click", async function(){
    this.disabled = true; log.innerHTML = ""; hintEl.hidden = true;
    // 1. secure context
    line((window.isSecureContext ? "✓" : "✗") + " secure context (https): " + window.isSecureContext, window.isSecureContext ? "ok" : "bad");
    if (!window.isSecureContext) hint("The page isn't on https — the camera is blocked. Use the https:// link.");

    // 2. getUserMedia support
    var hasGUM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    line((hasGUM ? "✓" : "✗") + " getUserMedia available: " + hasGUM, hasGUM ? "ok" : "bad");
    if (!hasGUM) { hint("This browser can't open the camera from a web page. Try Chrome or Safari — not an in-app browser (Instagram/TikTok/Facebook) or a TV browser."); this.disabled=false; return; }

    // 3. camera stream
    var w = line("… asking for the camera", "wait");
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      w.className = "row ok"; w.textContent = "✓ camera opened";
      var v = document.getElementById("v"); v.srcObject = stream; await v.play();
      line("✓ video playing (" + v.videoWidth + "×" + v.videoHeight + ")", "ok");
    } catch (e) {
      w.className = "row bad"; w.textContent = "✗ camera: " + (e.name || "") + " — " + (e.message || e);
      var n = e.name || "";
      if (n === "NotFoundError" || n === "OverconstrainedError") hint("No camera on THIS device. If you're casting to a TV or on a desktop with no webcam, run this on the laptop/phone whose camera will watch you.");
      else if (n === "NotAllowedError" || n === "SecurityError") hint("Camera permission was denied. Allow it in the browser's site settings (tap the lock/‘aA’ in the address bar), then re-run.");
      else if (n === "NotReadableError") hint("Another app is using the camera. Close Zoom/FaceTime/other tabs and re-run.");
      else hint("The camera couldn't start. Try a different browser (Chrome or Safari).");
      this.disabled = false; return;
    }

    // 4. load MediaPipe module
    var m = line("… loading the hand-tracking library", "wait");
    var mod;
    try {
      mod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12");
      m.className = "row ok"; m.textContent = "✓ library loaded";
    } catch (e) { m.className="row bad"; m.textContent = "✗ library load failed: " + (e.message || e); hint("Your network blocked the tracking library (jsdelivr CDN). On a restricted/work/school Wi-Fi it can be blocked — try cellular or another network."); this.disabled=false; return; }

    // 5. wasm + model
    var r = line("… loading the model (≈8 MB)", "wait");
    try {
      var vision = await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm");
      var hl = await mod.HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" }, runningMode: "VIDEO", numHands: 1 });
      r.className="row ok"; r.textContent = "✓ model ready";
      // 6. one detection
      var d = line("… reading your hand (hold your hand up to the camera)", "wait");
      var tries = 0;
      var tick = function(){
        var res; try { res = hl.detectForVideo(document.getElementById("v"), performance.now()); } catch(e){ d.className="row bad"; d.textContent="✗ detect error: "+(e.message||e); return; }
        if (res && res.landmarks && res.landmarks.length) { d.className="row ok"; d.textContent="✓ hand detected! Everything works — the bowling camera should run."; }
        else if (tries++ < 150) { d.textContent = "… reading your hand — hold it up ("+tries+")"; requestAnimationFrame(tick); }
        else { d.className="row wait"; d.textContent="⚠ model runs, but no hand seen in ~5s. Make sure your hand is in frame and well lit."; }
      };
      requestAnimationFrame(tick);
    } catch (e) { r.className="row bad"; r.textContent = "✗ model failed: " + (e.message || e); hint("The model or its wasm couldn't load/run. This can be an old browser (update iOS/Chrome) or a blocked CDN. Try updating the browser or another network."); }
    this.disabled = false;
  });
</script>
</body>
</html>
